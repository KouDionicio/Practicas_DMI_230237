<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura de TokTik: For You y Discover</title>
<desc id="desc">Dos flujos horizontales con capas de Presentation, Domain e Infrastructure. For You conecta la interfaz y DiscoverProvider con ForYouRepository, el datasource local, assets, mapper y VideoPost. Discover conecta DiscoverProvider con el repositorio externo, YouTube, Vimeo mediante backend local, PeerTube, sus mappers y ExternalVideo; incluye resiliencia, caché, concurrencia y persistencia local.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L12 5L0 10Z" fill="#465267"/></marker>
  <style>
    .bg{fill:#f7f8fc}.title{font:700 34px Arial,sans-serif;fill:#20283a}.subtitle{font:16px Arial,sans-serif;fill:#586174}
    .lane{fill:#fff;stroke:#d9deea;stroke-width:2;rx:20}.laneTitle{font:700 19px Arial,sans-serif;fill:#283247}.laneSub{font:13px Arial,sans-serif;fill:#586174}
    .pres{fill:#edf3ff;stroke:#5278c7}.domain{fill:#f2edff;stroke:#7959b4}.infra{fill:#eaf6ef;stroke:#37865d}.resource{fill:#fff5e6;stroke:#bb842d}
    .card{stroke-width:2.2;rx:14}.label{font:700 16px Arial,sans-serif;fill:#20283a}.small{font:14px Arial,sans-serif;fill:#586174}.tiny{font:12px Arial,sans-serif;fill:#586174}
    .flow{fill:none;stroke:#465267;stroke-width:3;marker-end:url(#arrow)}.legend{font:600 14px Arial,sans-serif;fill:#30394a}.noteTitle{font:700 15px Arial,sans-serif;fill:#263247}.noteText{font:13px Arial,sans-serif;fill:#586174}
  </style>
</defs>
<rect class="bg" width="1800" height="1100" rx="22"/>
<text class="title" x="42" y="52">TokTik · arquitectura real de For You y Discover</text>
<text class="subtitle" x="42" y="82">Clases verificadas en lib/. For You y Discover comparten DiscoverProvider; sus contratos y entidades son diferentes.</text>
<g transform="translate(42 104)">
  <rect x="0" y="0" width="19" height="19" rx="5" fill="#5278c7"/><text class="legend" x="28" y="15">Presentation</text>
  <rect x="150" y="0" width="19" height="19" rx="5" fill="#7959b4"/><text class="legend" x="178" y="15">Domain</text>
  <rect x="265" y="0" width="19" height="19" rx="5" fill="#37865d"/><text class="legend" x="293" y="15">Infrastructure</text>
  <rect x="445" y="0" width="19" height="19" rx="5" fill="#bb842d"/><text class="legend" x="473" y="15">APIs, assets y almacenamiento</text>
  <path class="flow" d="M740 10H800"/><text class="legend" x="814" y="15">flujo y llamadas</text>
</g>

<rect class="lane" x="24" y="145" width="1752" height="385" rx="20"/>
<text class="laneTitle" x="44" y="178">A · For You local</text>
<text class="laneSub" x="44" y="198">El feed reproduce assets locales y transforma sus metadatos en VideoPost.</text>
<rect class="card pres" x="30" y="240" width="190" height="135" rx="14"/>
<text class="label" x="45" y="278">UI · For You</text><text class="small" x="45" y="308">DiscoverScreen</text><text class="small" x="45" y="331">_FeedPage</text>
<rect class="card pres" x="250" y="240" width="190" height="135" rx="14"/>
<text class="label" x="265" y="278">DiscoverProvider</text><text class="small" x="265" y="308">FeedSection</text><text class="small" x="265" y="331">.forYou</text>
<rect class="card domain" x="470" y="240" width="190" height="135" rx="14"/>
<text class="label" x="485" y="278">ForYouRepository</text><text class="small" x="485" y="308">contrato de</text><text class="small" x="485" y="331">dominio</text>
<rect class="card infra" x="690" y="240" width="190" height="135" rx="14"/>
<text class="label" x="705" y="278">ForYouRepositoryImpl</text><text class="small" x="705" y="308">implementación</text><text class="small" x="705" y="331">del contrato</text>
<rect class="card infra" x="910" y="240" width="190" height="135" rx="14"/>
<text class="label" x="925" y="278">LocalForYouVideo</text><text class="label" x="925" y="301">Datasource</text><text class="small" x="925" y="333">lee metadatos</text>
<rect class="card resource" x="1130" y="240" width="190" height="135" rx="14"/>
<text class="label" x="1145" y="278">Datos y assets</text><text class="small" x="1145" y="308">local_video_posts.dart</text><text class="small" x="1145" y="331">assets/videos/*.mp4</text>
<rect class="card infra" x="1350" y="240" width="190" height="135" rx="14"/>
<text class="label" x="1365" y="278">LocalVideoModel</text><text class="small" x="1365" y="308">mapLocalVideoPosts()</text>
<rect class="card domain" x="1570" y="240" width="190" height="135" rx="14"/>
<text class="label" x="1585" y="278">VideoPost</text><text class="small" x="1585" y="308">entidad local</text><text class="small" x="1585" y="331">videoUrl = asset</text>
<path class="flow" d="M220 307H242"/><path class="flow" d="M440 307H462"/><path class="flow" d="M660 307H682"/><path class="flow" d="M880 307H902"/><path class="flow" d="M1100 307H1122"/><path class="flow" d="M1320 307H1342"/><path class="flow" d="M1540 307H1562"/>
<rect class="card resource" x="470" y="405" width="630" height="86" rx="14"/>
<text class="label" x="490" y="439">SharedPreferencesRepository</text><text class="small" x="490" y="466">persistencia compartida: likes, mute y override de tema</text>
<path class="flow" d="M345 375V393H785V397"/>

<rect class="lane" x="24" y="555" width="1752" height="385" rx="20"/>
<text class="laneTitle" x="44" y="588">B · Discover remoto</text>
<text class="laneSub" x="44" y="608">Las fuentes producen ExternalVideo; cada datasource puede fallar sin tumbar las otras.</text>
<rect class="card pres" x="30" y="650" width="190" height="145" rx="14"/>
<text class="label" x="45" y="690">UI · Discover</text><text class="small" x="45" y="720">DiscoverScreen</text><text class="small" x="45" y="743">feed remoto</text>
<rect class="card pres" x="250" y="650" width="190" height="145" rx="14"/>
<text class="label" x="265" y="690">DiscoverProvider</text><text class="small" x="265" y="720">mezcla y pagina</text><text class="small" x="265" y="743">fallos por fuente</text>
<rect class="card domain" x="470" y="650" width="190" height="145" rx="14"/>
<text class="label" x="485" y="690">PaginatedExternal</text><text class="label" x="485" y="713">VideoRepository</text><text class="small" x="485" y="745">contrato de dominio</text>
<rect class="card infra" x="690" y="650" width="190" height="145" rx="14"/>
<text class="label" x="705" y="690">ExternalVideo</text><text class="label" x="705" y="713">RepositoryImpl</text><text class="small" x="705" y="745">orquesta fuentes</text>
<rect class="card infra" x="910" y="650" width="190" height="145" rx="14"/>
<text class="label" x="925" y="686">Datasources</text><text class="small" x="925" y="716">YouTube · Vimeo</text><text class="small" x="925" y="739">PeerTube</text><text class="tiny" x="925" y="765">clases independientes</text>
<rect class="card resource" x="1130" y="650" width="190" height="145" rx="14"/>
<text class="label" x="1145" y="686">Servicios</text><text class="small" x="1145" y="716">YouTube API</text><text class="small" x="1145" y="739">Vimeo backend local</text><text class="small" x="1145" y="762">PeerTube API</text>
<rect class="card infra" x="1350" y="650" width="190" height="145" rx="14"/>
<text class="label" x="1365" y="686">Modelos y mappers</text><text class="small" x="1365" y="716">YouTubeVideoModel</text><text class="small" x="1365" y="739">VimeoVideoModel</text><text class="small" x="1365" y="762">PeerTubeVideoModel</text>
<rect class="card domain" x="1570" y="650" width="190" height="145" rx="14"/>
<text class="label" x="1585" y="690">ExternalVideo</text><text class="small" x="1585" y="720">entidad remota</text><text class="small" x="1585" y="743">model.toEntity()</text>
<path class="flow" d="M220 722H242"/><path class="flow" d="M440 722H462"/><path class="flow" d="M660 722H682"/><path class="flow" d="M880 722H902"/><path class="flow" d="M1100 722H1122"/><path class="flow" d="M1320 722H1342"/><path class="flow" d="M1540 722H1562"/>
<text class="tiny" x="1145" y="786">Vimeo: /api/vimeo/search</text>

<rect class="lane" x="24" y="965" width="1752" height="110" rx="20"/>
<text class="noteTitle" x="48" y="1001">Resiliencia</text><text class="noteText" x="48" y="1028">DiscoverProvider tolera fallos por datasource; una fuente fallida no elimina las demás.</text>
<text class="noteTitle" x="625" y="1001">Caché y concurrencia</text><text class="noteText" x="625" y="1028">Caché por página, máximo 2 peticiones simultáneas y backoff ante HTTP 429.</text>
<text class="noteTitle" x="1220" y="1001">Persistencia Discover</text><text class="noteText" x="1220" y="1028">SharedPreferencesRepository guarda IDs vistos y YouTube no embebibles.</text>
</svg>