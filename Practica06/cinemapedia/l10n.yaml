# Configuración de internacionalización (flutter gen-l10n).
# Los archivos lib/l10n/app_localizations*.dart se regeneran a partir de los
# .arb al compilar o con `flutter gen-l10n`.
arb-dir: lib/l10n
template-arb-file: app_es.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
