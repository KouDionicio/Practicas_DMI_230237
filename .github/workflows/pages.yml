name: Publicar portal de prácticas en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Añadir documentación de Práctica 03
        run: |
          mkdir -p docs/practica03/yes_no_app
          cp -R Practica03/yes_no_app/docs/. docs/practica03/yes_no_app/

      - name: Preparar archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4